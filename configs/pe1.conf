frr defaults traditional
hostname pe1
!
vrf VRF_A
exit-vrf
!
vrf VRF_B
exit-vrf
!
interface lo
 ip address 10.0.0.1/32
 ip router isis CORE
exit
!
interface eth1
 description LINK_TO_P1
 ip address 10.0.1.1/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
interface eth2 vrf VRF_A
 description LINK_TO_CE_A1
 ip address 172.16.1.1/30
exit
!
interface eth3 vrf VRF_B
 description LINK_TO_CE_B1
 ip address 172.16.1.1/30
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0100.0000.0001.00
exit
!
mpls ldp
 router-id 10.0.0.1
 address-family ipv4
  discovery transport-address 10.0.0.1
  interface eth1
  exit
 exit-address-family
exit
!
router bgp 65000
 bgp router-id 10.0.0.1
 no bgp default ipv4-unicast
 neighbor 10.0.0.100 remote-as 65000
 neighbor 10.0.0.100 update-source lo
 !
 address-family ipv4 vpn
  neighbor 10.0.0.100 activate
 exit-address-family
exit
!
router bgp 65000 vrf VRF_A
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 172.16.1.2 remote-as 65101
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.1.2 activate
  label vpn export auto
  rd vpn export 65000:100
  rt vpn both 65000:100
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65000 vrf VRF_B
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 neighbor 172.16.1.2 remote-as 65201
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor 172.16.1.2 activate
  label vpn export auto
  rd vpn export 65000:200
  rt vpn both 65000:200
  export vpn
  import vpn
 exit-address-family
exit
!
bfd
exit
!
