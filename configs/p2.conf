frr defaults traditional
hostname p2
!
interface lo
 ip address 10.0.0.12/32
 ip router isis CORE
exit
!
interface eth1
 description LINK_TO_P1
 ip address 10.0.12.2/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
interface eth2
 description LINK_TO_P3
 ip address 10.0.23.1/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
interface eth3
 description LINK_TO_PE2
 ip address 10.0.2.1/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0100.0000.0012.00
exit
!
mpls ldp
 router-id 10.0.0.12
 address-family ipv4
  discovery transport-address 10.0.0.12
  interface eth1
  exit
  interface eth2
  exit
  interface eth3
  exit
 exit-address-family
exit
!
bfd
exit
!
