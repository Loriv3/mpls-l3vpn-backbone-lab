frr defaults traditional
hostname p1
!
interface lo
 ip address 10.0.0.11/32
 ip router isis CORE
exit
!
interface eth1
 description LINK_TO_PE1
 ip address 10.0.1.2/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
interface eth2
 description LINK_TO_P2
 ip address 10.0.12.1/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
interface eth3
 description LINK_TO_P3
 ip address 10.0.13.1/30
 ip router isis CORE
 isis network point-to-point
 isis bfd
exit
!
interface eth4
 description LINK_TO_RR1
 ip address 10.0.100.1/30
 ip router isis CORE
 isis network point-to-point
exit
!
router isis CORE
 is-type level-2-only
 net 49.0001.0100.0000.0011.00
exit
!
mpls ldp
 router-id 10.0.0.11
 address-family ipv4
  discovery transport-address 10.0.0.11
  interface eth1
  exit
  interface eth2
  exit
  interface eth3
  exit
  interface eth4
  exit
 exit-address-family
exit
!
bfd
exit
!
